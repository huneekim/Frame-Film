<!doctype html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>HUNEE Pair Frame: Movie Film</title>

	<link rel="stylesheet" href="./font.css" />
	<link rel="stylesheet" href="./style.css" />

	<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
</head>

<body>
	<!-- 사이드바 컨트롤러 -->
	<aside class="sidebar">
		<header class="sidebar__header">
			<button type="button" class="btn btn--primary" id="saveBtn">
				💾 현재 상태 저장
			</button>
			<button type="button" class="btn btn--primary" id="captureBtn">
				📸 이미지로 저장
			</button>

			<button type="button" class="btn btn--danger" id="resetBtn">
				🗑️ 초기화
			</button>
		</header>

		<div class="sidebar__body">
			<form class="sidebar__panels" onsubmit="return false;">
				<!-- 기본 정보 설정 -->
				<section class="sidebar__group">
					<label class="sidebar__label" for="inputPair">페어명</label>
					<input class="sidebar__input" type="text" id="inputPair" value="페어명" />

					<label class="sidebar__label" for="inputAnniversary">기념일</label>
					<input class="sidebar__input" type="text" id="inputAnniversary" value="기념일 (최대 8글자)" pattern="[0-9]*"
						maxlength="8" />

					<label class="sidebar__label" for="inputCenter">프레임 번호</label>
					<input class="sidebar__input" type="text" id="inputCenter" value="01" inputmode="numeric" pattern="[0-9]*"
						maxlength="2" />
				</section>

				<!-- 사진 업로드 및 조절 -->
				<section class="sidebar__group">
					<label class="sidebar__label" for="photoInput">사진</label>
					<input class="sidebar__input sidebar__input--file" type="file" id="photoInput" accept="image/*" />

					<div class="sidebar__range-row">
						<label class="sidebar__range-label" for="photoScale">크기</label>
						<input class="sidebar__range" type="range" id="photoScale" min="100" max="300" value="100" />
					</div>

					<p class="sidebar__hint" id="photoHint">
						사진을 추가하면 프레임에 표시됩니다. 클릭 후 드래그로 위치를 옮기거나 슬라이더로 크기 조절이 가능합니다.
					</p>
				</section>

				<!-- 필터 설정 -->
				<section class="sidebar__group">
					<h2 class="sidebar__label">필터(%)</h2>

					<div class="sidebar__range-row">
						<label class="sidebar__range-label" for="filterBrightness">밝기</label>
						<input class="sidebar__range" type="range" id="filterBrightness" min="0" max="300" value="100" />
						<input class="sidebar__number" type="number" id="filterBrightnessNum" min="0" max="300" value="100" />
					</div>

					<div class="sidebar__range-row">
						<label class="sidebar__range-label" for="filterContrast">대비</label>
						<input class="sidebar__range" type="range" id="filterContrast" min="0" max="300" value="110" />
						<input class="sidebar__number" type="number" id="filterContrastNum" min="0" max="300" value="110" />
					</div>

					<div class="sidebar__range-row">
						<label class="sidebar__range-label" for="filterSaturate">채도</label>
						<input class="sidebar__range" type="range" id="filterSaturate" min="0" max="300" value="120" />
						<input class="sidebar__number" type="number" id="filterSaturateNum" min="0" max="300" value="120" />
					</div>

					<div class="sidebar__range-row">
						<label class="sidebar__range-label" for="filterSepia">세피아</label>
						<input class="sidebar__range" type="range" id="filterSepia" min="0" max="100" value="10" />
						<input class="sidebar__number" type="number" id="filterSepiaNum" min="0" max="100" value="10" />
					</div>

					<div class="sidebar__range-row">
						<label class="sidebar__range-label" for="noiseOpacity">노이즈</label>
						<input class="sidebar__range" type="range" id="noiseOpacity" min="0" max="100" value="50" />
						<input class="sidebar__number" type="number" id="noiseOpacityNum" min="0" max="100" value="50" />
					</div>
				</section>
			</form>
		</div>
	</aside>

	<!-- 메인 뷰포트 -->
	<main class="viewport">
		<div class="viewport__scale-wrapper" id="scaleWrapper" style="transform: scale(1); width: 1600px; height: 900px;">
			<div class="film-stage" id="captureArea">
				<!-- 필름 구멍 -->
				<div class="sprockets sprockets--top" id="spTop"></div>
				<div class="sprockets sprockets--bottom" id="spBottom">
					<span style="left: -672px"></span>
				</div>

				<!-- 바코드 -->
				<div class="film-barcodes" id="filmBarcodes">
					<div class="barcode-mark" style="left: 136px; width: 388px">
						<svg viewBox="0 0 1600 310" preserveAspectRatio="none"></svg>
					</div>
					<div class="barcode-mark" style="left: 608px; width: 392px">
						<svg viewBox="0 0 1600 310" preserveAspectRatio="none"></svg>
					</div>
					<div class="barcode-mark" style="left: -320px; width: 308px; overflow: hidden;">
						<svg style="left: 0px; width: 388px" viewBox="0 0 1600 310" preserveAspectRatio="none"></svg>
					</div>
					<div class="barcode-mark" style="left: 1148px; width: 132px; overflow: hidden;">
						<svg style="left: 0px; width: 388px" viewBox="0 0 1600 310" preserveAspectRatio="none"></svg>
					</div>
				</div>

				<!-- 상/하단 텍스트 코딩 -->
				<div class="film-code film-code--top">
					<span class="film-code__item-1" id="codeLeftText2">00A</span>
					<span>Film</span>
					<span id="pairText">Pair</span>
					<span id="anniversaryText">Anniversary</span>
					<span class="film-code__item-2" id="codeRightText2">01A</span>
				</div>

				<div class="film-code film-code--bottom">
					<span class="film-code__item-1">
						<span class="arrow-wide">
							<svg viewBox="0 0 20 10" preserveAspectRatio="none">
								<polygon points="0,0 20,5 0,10"></polygon>
							</svg>
						</span>
						<span id="codeLeftText">00</span>A
					</span>
					<span class="film-code__item-center" id="codeCenterText">01</span>
					<span class="film-code__item-2">
						<span class="arrow-wide">
							<svg viewBox="0 0 20 10" preserveAspectRatio="none">
								<polygon points="0,0 20,5 0,10"></polygon>
							</svg>
						</span>
						<span id="codeRightText">01</span>A
					</span>
				</div>

				<!-- 필름 프레임 -->
				<div class="filmstrip">
					<div class="film-frame film-frame--side film-frame--left">
						<img class="film-frame__photo" id="photoLeft" alt="" draggable="false" />
						<div class="film-frame__noise"></div>
					</div>
					<div class="film-frame film-frame--main">
						<img class="film-frame__photo" id="photoMain" alt="" draggable="false" />
						<div class="film-frame__noise"></div>
					</div>
					<div class="film-frame film-frame--side film-frame--right">
						<img class="film-frame__photo" id="photoRight" alt="" draggable="false" />
						<div class="film-frame__noise"></div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script src="./script.js"></script>
</body>

</html>
