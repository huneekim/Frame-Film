<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Discord Profile Refactored</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="coloris_min.css" />
  </head>
  <body>
    <div class="profile">
      <button class="profile__close-btn" aria-label="닫기">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <line
            x1="0.5"
            y1="0.5"
            x2="9.5"
            y2="9.5"
            stroke="#b5bac1"
            stroke-width="1.5"
          />
          <line
            x1="9.5"
            y1="0.5"
            x2="0.5"
            y2="9.5"
            stroke="#b5bac1"
            stroke-width="1.5"
          />
        </svg>
      </button>

      <!-- LEFT PANEL -->
      <aside class="left-panel">
        <header class="profile-hero">
          <div class="profile-hero__banner" data-photo-card>
            <input
              type="file"
              class="card__file-input"
              accept="image/*"
              hidden
            />
            <img class="card__photo" alt="" draggable="false" />
            <span class="card__placeholder">+</span>
          </div>
          <div class="profile-hero__avatar-wrapper">
            <!-- data-status: online, idle, dnd, offline-->
            <svg
              width="138"
              height="138"
              viewBox="0 0 138 138"
              class="profile-hero__avatar-svg"
              data-status="online"
              aria-hidden="true"
            >
              <mask id="avatar-status-mask">
                <rect width="138" height="138" fill="#fff" />
                <circle cx="100" cy="100" r="22" fill="#000" />
              </mask>
              <foreignObject
                x="0"
                y="0"
                width="120"
                height="120"
                mask="url(#avatar-status-mask)"
              >
                <div class="profile-hero__avatar" data-photo-card>
                  <input
                    type="file"
                    class="card__file-input"
                    accept="image/*"
                    hidden
                  />
                  <img class="card__photo" alt="" draggable="false" />
                  <span class="card__placeholder">+</span>
                </div>
              </foreignObject>
              <circle class="profile-hero__avatar-border" />
              <circle class="profile-hero__status-ring" />

              <!-- online 온라인 -->
              <circle
                class="profile-hero__status profile-hero__status--online"
              />

              <!-- idle 자리비움 -->
              <g class="profile-hero__status profile-hero__status--idle">
                <mask id="idle-mask">
                  <rect />
                  <circle />
                </mask>
                <circle />
              </g>

              <!-- dnd 방해 금지 -->
              <g class="profile-hero__status profile-hero__status--dnd">
                <circle />
                <rect />
              </g>

              <!-- offline 오프라인 -->
              <g class="profile-hero__status profile-hero__status--offline">
                <mask id="offline-mask">
                  <circle class="offline-mask--1" />
                  <circle class="offline-mask--2" />
                </mask>
                <circle />
              </g>
            </svg>

            <div
              class="status-bubble"
              role="tooltip"
              tabindex="0"
              aria-label="사용자 지정 상태"
            >
              <span
                class="status-bubble__text"
                contenteditable="true"
                spellcheck="false"
                >말풍선 내용</span
              >
              <span
                class="status-bubble__tail status-bubble__tail--1"
                aria-hidden="true"
              ></span>
              <span
                class="status-bubble__tail status-bubble__tail--2"
                aria-hidden="true"
              ></span>
            </div>
          </div>
        </header>

        <section class="profile-details">
          <h1
            class="profile-details__nickname"
            contenteditable="true"
            spellcheck="false"
          >
            닉네임
          </h1>

          <div class="profile-details__metadata">
            <span
              class="profile-details__username"
              contenteditable="true"
              spellcheck="false"
              >nickname</span
            >
            <span class="profile-details__separator" aria-hidden="true"></span>
            <span
              class="profile-details__username"
              contenteditable="true"
              spellcheck="false"
              >호칭</span
            >

            <div class="server-tag">
              <button
                type="button"
                class="server-tag__badge"
                data-emoji-slot="true"
                aria-label="이모지 선택"
              ></button>
              <span
                class="server-tag__name"
                contenteditable="true"
                spellcheck="false"
                >서버 태그</span
              >
            </div>
          </div>

          <div class="profile-actions">
            <button class="button button--primary">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M19 14a1 1 0 0 1 1 1v3h3a1 1 0 0 1 0 2h-3v3a1 1 0 0 1-2 0v-3h-3a1 1 0 1 1 0-2h3v-3a1 1 0 0 1 1-1Z"
                ></path>
                <path
                  d="M16.83 12.93c.26-.27.26-.75-.08-.92A9.5 9.5 0 0 0 12.47 11h-.94A9.53 9.53 0 0 0 2 20.53c0 .81.66 1.47 1.47 1.47h.22c.24 0 .44-.17.5-.4.29-1.12.84-2.17 1.32-2.91.14-.21.43-.1.4.15l-.26 2.61c-.02.3.2.55.5.55h7.64c.12 0 .17-.31.06-.36C12.82 21.14 12 20.22 12 19a3 3 0 0 1 3-3h.5a.5.5 0 0 0 .5-.5V15c0-.8.31-1.53.83-2.07ZM12 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
                ></path>
              </svg>
              <span class="button__label">친구 추가하기</span>
            </button>

            <button class="button button--icon" aria-label="메시지 보내기">
              <svg
                width="13.86"
                height="13.33"
                viewBox="0 0 24 22"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="M12 22a10 10 0 1 0-8.45-4.64c.13.19.11.44-.04.61l-2.06 2.37A1 1 0 0 0 2.2 22H12Z"
                ></path>
              </svg>
            </button>

            <button class="button button--icon" aria-label="더보기">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M4 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10-2a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm8 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                ></path>
              </svg>
            </button>
          </div>

          <article class="info-block">
            <h2 class="info-block__title">연애 시기:</h2>
            <div class="date-list">
              <div class="date-list__item">
                <button
                  type="button"
                  class="date-list__badge"
                  data-emoji-slot="true"
                  aria-label="이모지 선택"
                ></button>
                <span class="date-list__text"
                  ><span
                    class="date-list__value"
                    contenteditable="true"
                    spellcheck="false"
                    >yyyy</span
                  >년
                  <span
                    class="date-list__value"
                    contenteditable="true"
                    spellcheck="false"
                    >mm</span
                  >월
                  <span
                    class="date-list__value"
                    contenteditable="true"
                    spellcheck="false"
                    >dd</span
                  >일</span
                >
              </div>
              <span
                class="profile-details__separator"
                aria-hidden="true"
              ></span>
              <div class="date-list__item">
                <button
                  type="button"
                  class="date-list__badge"
                  data-emoji-slot="true"
                  aria-label="이모지 선택"
                ></button>
                <span class="date-list__text"
                  ><span
                    class="date-list__value"
                    contenteditable="true"
                    spellcheck="false"
                    >yyyy</span
                  >년
                  <span
                    class="date-list__value"
                    contenteditable="true"
                    spellcheck="false"
                    >mm</span
                  >월
                  <span
                    class="date-list__value"
                    contenteditable="true"
                    spellcheck="false"
                    >dd</span
                  >일</span
                >
              </div>
            </div>
          </article>

          <article class="info-block">
            <h2 class="info-block__title">역할</h2>
            <div class="role-list">
              <div class="role-list__tag">
                <span class="role-list__badge" data-swatch-for="role-color-1">
                  <input
                    type="text"
                    id="role-color-1"
                    class="role-list__color-input"
                    value="#5865F2"
                    aria-label="역할 색상 선택"
                  />
                </span>
                <span
                  class="role-list__text"
                  contenteditable="true"
                  spellcheck="false"
                  >역할1</span
                >
              </div>
              <div class="role-list__tag">
                <span class="role-list__badge" data-swatch-for="role-color-2">
                  <input
                    type="text"
                    id="role-color-2"
                    class="role-list__color-input"
                    value="#EB459E"
                    aria-label="역할 색상 선택"
                  />
                </span>
                <span
                  class="role-list__text"
                  contenteditable="true"
                  spellcheck="false"
                  >역할2</span
                >
              </div>
            </div>
          </article>

          <article class="info-block">
            <h2 class="info-block__title">참고 (나에게만 보여요)</h2>
            <p
              class="info-block__note"
              contenteditable="true"
              spellcheck="false"
            >
              클릭하여 메모 추가하기
            </p>
          </article>
        </section>
      </aside>

      <!-- RIGHT PANEL (Main Content) -->
      <main class="right-panel">
        <nav class="category-tabs">
          <button class="category-tabs__item category-tabs__item--active">
            Playlist
          </button>
          <button class="category-tabs__item">Mood</button>
        </nav>

        <div class="playlist-content">
          <!-- Now playing -->
          <section class="board">
            <header class="board__header">
              <h2 class="board__title">Now Playing</h2>
              <button class="board__more-btn" aria-label="더보기">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    fill="currentColor"
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M4 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10-2a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm8 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                  ></path>
                </svg>
              </button>
            </header>
            <div class="board__featured">
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
              <div class="board__featured-info">
                <h3
                  class="board__featured-title"
                  contenteditable="true"
                  spellcheck="false"
                >
                  노래 제목
                </h3>
                <p
                  class="board__featured-subtitle"
                  contenteditable="true"
                  spellcheck="false"
                >
                  가수
                </p>
              </div>
            </div>
          </section>
          <!-- 캐릭터 A -->
          <section class="board">
            <header class="board__header">
              <h2 class="board__title">
                Playlist:<span
                  class="status-bubble__text"
                  contenteditable="true"
                  spellcheck="false"
                  >캐릭터 A</span
                >
              </h2>
              <button class="board__more-btn" aria-label="더보기">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    fill="currentColor"
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M4 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10-2a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm8 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                  ></path>
                </svg>
              </button>
            </header>
            <div class="board__list">
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
            </div>
          </section>
          <!-- 캐릭터 B-->
          <section class="board">
            <header class="board__header">
              <h2 class="board__title">
                Playlist:<span
                  class="status-bubble__text"
                  contenteditable="true"
                  spellcheck="false"
                  >캐릭터 B</span
                >
              </h2>
              <button class="board__more-btn" aria-label="더보기">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    fill="currentColor"
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M4 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10-2a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm8 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                  ></path>
                </svg>
              </button>
            </header>
            <div class="board__list">
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
            </div>
          </section>
          <!-- 페어 -->
          <section class="board board-last">
            <header class="board__header">
              <h2 class="board__title">
                Playlist:<span
                  class="status-bubble__text"
                  contenteditable="true"
                  spellcheck="false"
                  >Pair name</span
                >
              </h2>
              <button class="board__more-btn" aria-label="더보기">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    fill="currentColor"
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M4 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10-2a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm8 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                  ></path>
                </svg>
              </button>
            </header>
            <div class="board__list">
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
              <div class="card card--square" data-photo-card>
                <input
                  type="file"
                  class="card__file-input"
                  accept="image/*"
                  hidden
                />
                <img class="card__photo" alt="" draggable="false" />
                <span class="card__placeholder">+</span>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Twitter Emoji -->
    <script
      src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Coloris -->
    <script src="coloris_min.js" crossorigin="anonymous"></script>

    <script src="script.js" crossorigin="anonymous"></script>
  </body>
</html>
